services:
  # Frontend - React with Vite
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: drs_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - drs_network

  # Backend - Flask API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drs_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=mysql+pymysql://root:Password123@database:3306/drs_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECRET_KEY=your-secret-key-change-in-production
      - MAIL_SERVER=smtp.gmail.com
      - MAIL_PORT=587
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - drs_network

  # Database - MySQL
  database:
    image: mysql:8.0
    container_name: drs_database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Password123
      MYSQL_DATABASE: drs_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - drs_network

  # Cache - Redis
  redis:
    image: redis:7-alpine
    container_name: drs_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - drs_network

volumes:
  mysql_data:

networks:
  drs_network:
    driver: bridge
